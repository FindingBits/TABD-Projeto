{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Portuguese Election Archive</h2>
    <span class="badge bg-secondary">Post-1974 Records</span>
</div>

<div class="row g-4">
    {% for e in eleicoes %}
        
        {% if loop.changed(e.tipo) %}
            {% if not loop.first %}
                <div class="col-12 mt-5 mb-3"><hr class="opacity-25"></div>
            {% endif %}
            
            <div class="col-12">
                <h3 class="h4 text-uppercase fw-light text-secondary mb-3">
                    <i class="bi {{ 'bi-bank' if e.tipo == 'General' else 'bi-person-vcard' }} me-2"></i>
                    {{ e.tipo }} Elections
                </h3>
            </div>
        {% endif %}

        <div class="col-md-3">
            <div class="card h-100 shadow-sm border-0 bg-white hover-shadow transition">
                <div class="card-body text-center p-4">
                    <div class="mb-3 text-primary">
                        <i class="bi {{ e.icon }}" style="font-size: 2rem;"></i>
                    </div>
                    <h5 class="card-title fw-bold">{{ e.nome }}</h5>
                    <p class="card-text small text-muted">Year: {{ e.ano }}</p>
                    <div class="d-grid mt-3">
                            <a href="detalhes/{{ e.ano }}" class="btn btn-outline-primary btn-sm">
                                View Details
                            </a>
                    </div>
                </div>
            </div>
        </div>

    {% endfor %}
</div>
{% endblock %}
